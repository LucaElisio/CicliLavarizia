<div class="grid grid-cols-8 gap-x-5.5">

    <!-- Sidebar -->
    <p-card class="col-span-2 sidebar" header="Categorie">

        <div class="card flex justify-center">
            <div>
                <input type="text" pInputText [(ngModel)]="pageSize" (ngModelChange)="getProducts()" class="w-full mb-4" />
                <p-slider [(ngModel)]="pageSize" (ngModelChange)="getProducts()" [step]="3" class="w-56" min="3" max="99"></p-slider>
            </div>
        </div>

        <br>
        <input type="button" value="Tutti i Prodotti" (click)="changeCategory('All')"
            [class.active]="productCategory === 'All'"
            class="text-lg font-semibold transition-transform duration-200 ease-in-out transform hover:scale-105"
            style="cursor: pointer; margin-left: 12px; margin-top: 8px;">

        @for(category of allCategories(); track $index) {
        <div (click)="changeCategory(category.name)" [class.active]="productCategory === category.name"
            class="text-lg font-semibold transition-transform duration-200 ease-in-out transform hover:scale-105"
            style="cursor: pointer; margin-left: 12px; margin-top: 8px;">
            {{ category.name }}
        </div>
        }

    </p-card>

    <!-- Griglia Prodotti -->
    <div class="col-span-6" style="grid-template-columns: repeat(3, 1fr); gap: 20px; display: grid;">

        

        <!-- Lista prodotti -->
        <p-card class="productCard" *ngFor="let p of allProducts()">

            <!-- <ng-template pTemplate="image">
                <img [src]="`data:image/gif;base64,${p.ThumbNailPhoto}`"
                    style="width: 100%; height: 250px; object-fit: cover; border-top-left-radius: 8px; border-top-right-radius: 8px;">
            </ng-template> -->

            <ng-template pTemplate="title">
                <h2 style="color: rgb(235, 238, 232); font-size: 1.5rem; margin: 10px 0;">
                    {{ p.name }}
                </h2>
            </ng-template>

            <ng-template pTemplate="subtitle">
                <h3 style="color: rgb(170, 200, 170); font-size: 1.2rem; margin: 5px 0;">
                    € {{ p.listPrice }}
                </h3>
            </ng-template>

            <ng-template pTemplate="size">
                <p style="color: rgb(190, 195, 188); font-size: 1rem; margin: 10px 0;">
                    Size: {{ p.size }}
                </p>
            </ng-template>
        </p-card>

        <!-- Messaggio se non ci sono prodotti -->
        <div *ngIf="allProducts().length === 0" class="text-white">
            Nessun prodotto disponibile.
        </div>

    </div>

</div>
