<div class="grid grid-cols-8 gap-x-5.5">

    <!-- Sidebar Categorie -->
    <div class="col-span-2">
        <div class="categorie">
            Categorie
        </div>
    </div>

    <!-- Griglia Prodotti -->
    <div class="col-span-6" style="grid-template-columns: repeat(3, 1fr); gap: 20px; display: grid;">

        <!-- Placeholder caricamento -->
        <div *ngIf="loading" class="text-white">
            Caricamento prodotti...
        </div>

        <!-- Lista prodotti -->
        <p-card class="productCard" *ngFor="let p of allProducts">

            <!-- <ng-template pTemplate="image">
                <img [src]="`data:image/gif;base64,${p.ThumbNailPhoto}`"
                    style="width: 100%; height: 250px; object-fit: cover; border-top-left-radius: 8px; border-top-right-radius: 8px;">
            </ng-template> -->

            <ng-template pTemplate="title">
                <h2 style="color: white; font-size: 1.5rem; margin: 10px 0;">
                    {{ p.name }}
                </h2>
            </ng-template>

            <ng-template pTemplate="subtitle">
                <h3 style="color: white; font-size: 1.2rem; margin: 5px 0;">
                    € {{ p.listPrice }}
                </h3>
            </ng-template>

            <ng-template pTemplate="size">
                <p style="color: white; font-size: 1rem; margin: 10px 0;">
                    Size: {{ p.size }}
                </p>
            </ng-template>
        </p-card>

        <!-- Messaggio se non ci sono prodotti -->
        <div *ngIf="!loading && allProducts.length === 0" class="text-white">
            Nessun prodotto disponibile.
        </div>

    </div>

</div>
