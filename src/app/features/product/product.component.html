<p-drawer [(visible)]="isSidebarOpen" position="left" [modal]="true" [showCloseIcon]="true" class="md:hidden">
    <app-product-sidebar [pageSize]="pageSize"></app-product-sidebar>
</p-drawer>

<section class="grid grid-cols-12 gap-4 md:gap-6 p-4 md:p-6">

    <aside class="hidden md:block md:col-span-2">
        <app-product-sidebar [pageSize]="pageSize"></app-product-sidebar>
    </aside>

    <div class="col-span-12 md:hidden mb-4">
        <p-button variant="outlined" (click)="isSidebarOpen = true" class="w-full">
            Filtri e Categorie
        </p-button>
    </div>

    <div class="col-span-12  md:col-span-10 space-y-4">

        @if (isLoading()) {
        <p-progressbar class="w-full" mode="indeterminate" [style]="{ height: '2px' }"></p-progressbar>
        }

        <p-dataview [value]="products()" layout="grid" [lazy]="true" [paginator]="true" [rows]="pageSize"
            [totalRecords]="totalProducts()" (onLazyLoad)="loadProducts($event)">

            <ng-template #grid let-items>
                <div class="flex justify-center w-full">
                    <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-4 md:gap-6 w-full max-w-6xl">
                        @for (product of items; track $index) {
                        <div class="w-full p-2 md:p-3">
                            <p-card [header]="product.name" class="h-full flex flex-col">
                                <img [src]="product.imageSrc" [alt]="product.thumbnailPhotoFileName"
                                    class="h-48 object-contain rounded mb-2 md:mb-4" loading="lazy" />
                                <div class="flex-1 space-y-1">
                                    <p>{{ product.productNumber }}</p>
                                    <p>{{ product.color }}</p>
                                    <p>{{ product.listPrice }}</p>
                                    <p>{{ product.size }}</p>
                                </div>
                            </p-card>
                        </div>
                        }
                    </div>
                </div>
            </ng-template>


        </p-dataview>

        @if (errorMsg) {
        <p class="text-red-600 mt-2">{{ errorMsg }}</p>
        }

    </div>
</section>
