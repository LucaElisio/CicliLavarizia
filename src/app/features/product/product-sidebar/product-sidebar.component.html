<p-card header="Categorie" class="shadow-none border-none">
  @if (isLoading()) {
  <div class="flex justify-center p-4">
    <p-progress-spinner ariaLabel="loading" strokeWidth="4" [style]="{ width: '30px', height: '30px' }" />
  </div>
  } @else {
  <nav class="flex flex-col gap-1">
    @for (category of categories(); track category.productCategoryId) {
    @let categorySlug = formatCategorySlug(category.name);
    @let isActive = categorySelected === categorySlug;

    <a routerLink="/products" [queryParams]="{ category: categorySlug, page: 1, pageSize: pageSize }"
      class="flex items-center justify-between px-3 py-2 rounded-lg transition-all duration-200 group" [ngClass]="{
             'bg-primary-500 text-primary-contrast font-semibold shadow-sm': isActive,
             'hover:bg-gray-100 hover:text-black': !isActive
           }">

      <span class="text-sm">{{ category.name }}</span>

    </a>
    } @empty {
    <div class="text-center p-4 bg-gray-50 rounded-lg">
      <span class="text-xs text-gray-500 italic">Nessuna categoria</span>
    </div>
    }
  </nav>
  }
</p-card>
