<p-toast position="top-right"></p-toast>
<div class="container mx-auto px-4 py-6">
    <!-- Pulsante Indietro -->
    <div class="mb-6">
        <p-button 
            label="Indietro" 
            [outlined]="true"
            [style]="{'background-color': 'rgb(170, 200, 170)', 'color': 'rgb(20, 20, 20)', 'border': 'none', 'font-weight': 'bold'}"
            (onClick)="location.back()">
        </p-button>
    </div>

    <!-- Card Principale -->
    <p-card [style]="{'background-color': 'rgb(78, 86, 80)', 'border-radius': '8px'}">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Immagine Prodotto -->
            <div class="flex items-center justify-center rounded-lg" style="background-color: rgba(0, 0, 0, 0.2); padding: 16px;">
                <img 
                    [src]="product()?.thumbNailPhoto" 
                    [alt]="product()?.name"
                    class="w-full h-full object-contain rounded-lg shadow-md"
                    style="max-height: 100%; max-width: 100%;" />
            </div>

            <!-- Dettagli Prodotto -->
            <div class="flex flex-col gap-6">
                <!-- Titolo -->
                <div>
                    <h1 class="text-3xl font-bold" style="color: rgb(235, 238, 232);">
                        {{ product()?.name }}
                    </h1>
                    <p *ngIf="product()?.productNumber" style="color: rgb(190, 195, 188);">
                        Codice: {{ product()?.productNumber }}
                    </p>
                </div>

                <p-divider></p-divider>

                <!-- Prezzo -->
                <div class="p-4 rounded-lg" style="background-color: rgba(170, 200, 170, 0.15);">
                    <div class="text-sm mb-1" style="color: rgb(190, 195, 188);">Prezzo</div>
                    <div class="text-4xl font-bold" style="color: rgb(170, 200, 170);">
                        € {{ product()?.listPrice?.toFixed(2) }}
                    </div>
                </div>

                <!-- Specifiche -->
                <div class="space-y-3">
                    <div *ngIf="product()?.color" class="flex items-center gap-3">
                        <span class="font-medium w-24" style="color: rgb(190, 195, 188);">Colore:</span>
                        <span style="color: rgb(235, 238, 232);">{{ product()?.color }}</span>
                    </div>
                    <div *ngIf="product()?.size" class="flex items-center gap-3">
                        <span class="font-medium w-24" style="color: rgb(190, 195, 188);">Taglia:</span>
                        <span style="color: rgb(235, 238, 232);">{{ product()?.size }}</span>
                    </div>
                    <div *ngIf="product()?.weight" class="flex items-center gap-3">
                        <span class="font-medium w-24" style="color: rgb(190, 195, 188);">Peso:</span>
                        <span style="color: rgb(235, 238, 232);">{{ product()?.weight }} kg</span>
                    </div>
                </div>

                <p-divider></p-divider>

                <!-- Pulsante Aggiungi al Carrello -->
                <div class="flex gap-3">
                    <p-button 
                        label="Aggiungi al carrello" 
                        [style]="{'width': '100%', 'background-color': 'rgb(170, 200, 170)', 'color': 'rgb(20, 20, 20)', 'border': 'none', 'font-weight': 'bold'}"
                        (onClick)="addToCart(productId)">
                    </p-button>
                </div>
            </div>
        </div>

        <!-- Descrizione -->
        <div class="mt-8">
            <p-divider></p-divider>
            <div class="mt-6">
                <h2 class="text-2xl font-bold" style="color: rgb(235, 238, 232);">
                    <span class="material-icons mr-2" style="vertical-align: middle;">info</span>
                    Descrizione del prodotto
                </h2>
                <p class="leading-relaxed text-lg" style="color: rgb(190, 195, 188);">
                    {{ productDescription || 'Nessuna descrizione disponibile.' }}
                </p>
            </div>
        </div>
    </p-card>

    <!-- Card Recensioni (separata) -->
    <p-card class="mt-6" [style]="{'background-color': 'rgb(78, 86, 80)', 'border-radius': '8px'}">
        <app-review [productId]="productId"></app-review>
    </p-card>
</div>
