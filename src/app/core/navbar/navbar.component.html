<header
  class="flex items-center justify-between py-6 px-4 sm:px-6 lg:px-8 w-full"
  [class.navbar-hidden]="!isNavbarVisible"
  [class.navbar-visible]="isNavbarVisible && !isAtTop"
  [class.navbar-at-top]="isAtTop"
>
  <div class="flex items-center gap-3">
    <h1>
      <a routerLink="/" class="flex items-center gap-3">
        <span class="material-icons bike">pedal_bike</span>
        <span class="text-2xl font-bold">Cicli L'Avarizia</span>
      </a>
    </h1>
  </div>

  <div class="relative w-full max-w-md mx-8">
    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
      <span class="material-icons text-body text-base">search</span>
    </div>

    <input
      type="search"
      id="search"
      #searchInput
      class="block w-full p-3 ps-12 text-heading text-sm rounded-lg focus:outline-1"
      style="background-color: #1c1b22"
      placeholder="Cerca..."
    />
  </div>

  <div class="flex items-center gap-6">
    <a routerLink="/products" class="text-lg font-semibold transition-transform hover:scale-105">
      Esplora Modelli
    </a>

    @if (authService.isAuthenticated()) {
    <p-overlay-badge
      [value]="cartService.cartProducts()?.totalElements ?? 0"
      badgeSize="small"
      [style]="{ outline: 'unset' }"
    >
      <a routerLink="/cart" class="material-icons">shopping_cart</a>
      <app-cart></app-cart>
    </p-overlay-badge>
    }

    <nav>
      <ul class="flex items-center">
        @if (authService.isAuthenticated()) {
        <li>
          <app-sidebar></app-sidebar>
        </li>
        } @else {
        <li>
          <a
            routerLink="/auth/login"
            pButton
            label="Login"
            class="transition-transform hover:scale-105"
          ></a>
        </li>
        }
      </ul>
    </nav>
  </div>
</header>
