<header class="flex justify-between items-center py-6 px-12">
  <h1 class="text-2xl font-bold">
    <a routerLink="/" class="flex items-center gap-3">
      <span class="material-icons text-3xl bike">pedal_bike</span>
      <span>Cicli L'Avarizia</span>
    </a>
  </h1>

  <nav>
    <ul class="flex flex-row items-center justify-between gap-4">
      @if (authService.isAuthenticated()) {
      <li class="card flex justify-center">
        <p-drawer [(visible)]="visible" [closable]="false" position="right">
          <ng-template #header>Info User</ng-template>
          <ng-template #footer>
            <div class="flex items-center gap-2">
              <a routerLink="/profile" pButton label="Settings" class="w-full" outlined></a>
              <a
                routerLink="/auth/logout"
                pButton
                label="logout"
                class="w-full"
                severity="danger"
                text
              ></a>
            </div>
          </ng-template>
        </p-drawer>
        <p-button
          (onClick)="visible = true"
          styleClass="transition-transform duration-200 ease-in-out transform hover:scale-105"
          ><i class="material-icons">person</i></p-button
        >
      </li>
      }@else {
      <li>
        <a
          routerLink="/auth/login"
          pButton
          label="Login"
          class="transition-transform duration-200 ease-in-out transform hover:scale-105"
        >
        </a>
      </li>
      }
    </ul>
  </nav>
</header>
