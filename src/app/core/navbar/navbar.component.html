<header class="flex bg-primary-800  md:flex-row flex-col items-center justify-between w-full md:py-4 md:px-8 py-3 px-4"
  [class.navbar-hidden]="!isNavbarVisible">


  <div class="flex items-center justify-between w-full md:w-auto gap-4">
    <h1>
      <a routerLink="/" class="flex items-center gap-2">
        <span class="material-icons bike text-2xl">pedal_bike</span>
        <span class="text-xl md:text-2xl font-bold tracking-tight">Cicli L'Avarizia</span>
      </a>
    </h1>

    <a routerLink="/products" class="text-sm md:text-lg font-semibold ml-auto md:ml-0 md:hidden">
      Prodotti
    </a>

    <div class="flex items-center gap-3 md:hidden">
      @if (authService.isAuthenticated()) {
      <p-overlay-badge [value]="cartService.cartProducts()?.totalElements ?? 0" badgeSize="small">
        <a routerLink="/cart" class="material-icons">shopping_cart</a>
      </p-overlay-badge>
      <app-sidebar></app-sidebar>
      } @else {
      <a routerLink="/auth/login" class="material-icons">account_circle</a>
      }
    </div>
  </div>

  <div class="relative w-full max-w-md mt-3 md:mt-0 mx-0 md:mx-8 order-last md:order-0">
    <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
      <span class="material-icons text-gray-400 text-base">search</span>
    </div>

    <input type="search" id="search" #searchInput
      class="block w-full p-2.5 ps-10 text-sm rounded-xl focus:ring-1 focus:ring-white/20 outline-none"
      style="background-color: #1c1b22; border: 1px solid #333;" placeholder="Cerca prodotti..." />
  </div>

  <div class="hidden md:flex items-center gap-6">
    <a routerLink="/products" class="text-lg font-semibold transition-transform hover:scale-105">
      Prodotti
    </a>

    @if (authService.isAuthenticated()) {
    <p-overlay-badge [style]="{outline: 'unset'}" [value]="cartService.cartProducts()?.totalElements ?? 0"
      badgeSize="small">
      <a routerLink="/cart" class="material-icons">shopping_cart</a>
    </p-overlay-badge>
    }

    <nav>
      <ul class="flex items-center">
        @if (authService.isAuthenticated()) {
        <li><app-sidebar></app-sidebar></li>
        } @else {
        <li>
          <a routerLink="/auth/login" pButton label="Login" class="transition-transform hover:scale-105"></a>
        </li>
        }
      </ul>
    </nav>
  </div>
</header>
